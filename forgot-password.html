<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | Creator Nihar</title>
  <meta name="description" content="Reset your Creator Nihar account password securely.">

  <!-- Favicon Configuration -->
  <link rel="icon" type="image/png" sizes="48x48" href="assets/images/favicon-48x48.png">
  <link rel="icon" type="image/png" sizes="96x96" href="assets/images/favicon-96x96.png">
  <link rel="shortcut icon" href="favicon.ico">

  <!-- Google Fonts Preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Main & Auth Stylesheets -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/auth.css">

  <!-- Supabase JS CDN (v2) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="auth-page-wrapper">
    <div class="auth-card">
      <div class="auth-brand">
        <a href="index.html" title="Back to Creator Nihar">
          <img src="assets/images/logo.jpg" alt="Creator Nihar" class="auth-brand-logo">
        </a>
        <h1 class="auth-brand-title">Reset Password</h1>
        <p class="auth-brand-desc">Enter your registered email to receive a password reset link</p>
      </div>

      <div id="authAlert" class="auth-alert" style="display: none;"></div>

      <form id="forgotForm">
        <div class="auth-form-group">
          <label for="resetEmail">Email Address <span class="req">*</span></label>
          <div class="auth-input-wrap">
            <input type="email" id="resetEmail" class="auth-input" placeholder="name@example.com" required autocomplete="email">
          </div>
        </div>

        <button type="submit" class="btn-auth-submit" id="resetSubmitBtn" style="margin-top: 10px;">
          <span>Send Recovery Email</span>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </button>
      </form>

      <div class="auth-footer">
        <p>Remember your password? <a href="login.html" class="auth-link">Return to Log In</a></p>
        <p style="margin-top: 10px;">
          <a href="index.html" class="auth-link" style="font-size: 0.82rem; color: var(--text-muted);">← Back to Creator Nihar Home</a>
        </p>
      </div>
    </div>
  </div>

  <!-- Supabase Config & Logic -->
  <script src="assets/js/supabase-config.js?v=1.3"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const forgotForm = document.getElementById('forgotForm');
      const resetEmail = document.getElementById('resetEmail');
      const resetSubmitBtn = document.getElementById('resetSubmitBtn');
      const authAlert = document.getElementById('authAlert');

      function showAlert(msg, type = 'error') {
        authAlert.className = `auth-alert ${type}`;
        authAlert.innerHTML = `<span>${msg}</span>`;
        authAlert.style.display = 'flex';
      }

      forgotForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        authAlert.style.display = 'none';

        const email = resetEmail.value.trim();
        if (!email) {
          showAlert('Please enter your email address.');
          return;
        }

        resetSubmitBtn.disabled = true;
        resetSubmitBtn.innerHTML = `<span>Sending Link...</span>`;

        try {
          await window.CNAuth.resetPasswordForEmail(email);
          showAlert('Password recovery link sent! Please check your email inbox and spam folder.', 'success');
          resetSubmitBtn.innerHTML = `<span>Link Sent ✓</span>`;
        } catch (err) {
          console.error('Password reset error:', err);
          showAlert(err.message || 'Unable to send password recovery email.', 'error');
          resetSubmitBtn.disabled = false;
          resetSubmitBtn.innerHTML = `<span>Send Recovery Email</span>`;
        }
      });
    });
  </script>
</body>
</html>
