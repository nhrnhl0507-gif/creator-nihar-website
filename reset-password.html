<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password | Creator Nihar</title>
  <meta name="description" content="Set a new password for your Creator Nihar account.">

  <!-- Favicon Configuration -->
  <link rel="icon" type="image/png" sizes="48x48" href="assets/images/favicon-48x48.png">
  <link rel="icon" type="image/png" sizes="96x96" href="assets/images/favicon-96x96.png">
  <link rel="shortcut icon" href="favicon.ico">

  <!-- Google Fonts Preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Main & Auth Stylesheets -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/auth.css">

  <!-- Supabase JS CDN (v2) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="auth-page-wrapper">
    <div class="auth-card">
      <div class="auth-brand">
        <a href="index.html" title="Back to Creator Nihar">
          <img src="assets/images/logo.jpg" alt="Creator Nihar" class="auth-brand-logo">
        </a>
        <h1 class="auth-brand-title">Set New Password</h1>
        <p class="auth-brand-desc">Enter your new secure password below</p>
      </div>

      <div id="authAlert" class="auth-alert" style="display: none;"></div>

      <form id="newPasswordForm">
        <div class="auth-form-group">
          <label for="newPassword">New Password <span class="req">*</span></label>
          <div class="auth-input-wrap">
            <input type="password" id="newPassword" class="auth-input" placeholder="Minimum 6 characters" required autocomplete="new-password">
          </div>
        </div>

        <div class="auth-form-group">
          <label for="confirmNewPassword">Confirm New Password <span class="req">*</span></label>
          <div class="auth-input-wrap">
            <input type="password" id="confirmNewPassword" class="auth-input" placeholder="Re-enter password" required autocomplete="new-password">
          </div>
        </div>

        <button type="submit" class="btn-auth-submit" id="updatePasswordBtn" style="margin-top: 10px;">
          <span>Update Password</span>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </button>
      </form>

      <div class="auth-footer">
        <p><a href="login.html" class="auth-link">Return to Log In</a></p>
      </div>
    </div>
  </div>

  <!-- Supabase Config & Logic -->
  <script src="assets/js/supabase-config.js?v=1.3"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const newPasswordForm = document.getElementById('newPasswordForm');
      const newPassword = document.getElementById('newPassword');
      const confirmNewPassword = document.getElementById('confirmNewPassword');
      const updatePasswordBtn = document.getElementById('updatePasswordBtn');
      const authAlert = document.getElementById('authAlert');

      function showAlert(msg, type = 'error') {
        authAlert.className = `auth-alert ${type}`;
        authAlert.innerHTML = `<span>${msg}</span>`;
        authAlert.style.display = 'flex';
      }

      newPasswordForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        authAlert.style.display = 'none';

        const pwd = newPassword.value;
        const confirmPwd = confirmNewPassword.value;

        if (!pwd || !confirmPwd) {
          showAlert('Please fill in both password fields.');
          return;
        }

        if (pwd.length < 6) {
          showAlert('Password must be at least 6 characters long.');
          return;
        }

        if (pwd !== confirmPwd) {
          showAlert('Passwords do not match. Please re-enter.');
          return;
        }

        updatePasswordBtn.disabled = true;
        updatePasswordBtn.innerHTML = `<span>Updating Password...</span>`;

        try {
          await window.CNAuth.updatePassword(pwd);
          showAlert('Password updated successfully! Redirecting to login...', 'success');
          setTimeout(() => {
            window.location.href = 'login.html';
          }, 1200);
        } catch (err) {
          console.error('Update password error:', err);
          showAlert(err.message || 'Unable to update password. Recovery link may have expired.', 'error');
          updatePasswordBtn.disabled = false;
          updatePasswordBtn.innerHTML = `<span>Update Password</span>`;
        }
      });
    });
  </script>
</body>
</html>
